name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          python -m pytest -q
          $code = $LASTEXITCODE
          Write-Host "pytest exit code: $code"
          if ($code -eq 1 -or $code -eq 2) {
            exit $code
          }

      - name: Build exe
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Build installer
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )
          $iscc = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) {
              $iscc = $candidate
              break
            }
          }
          if (-not $iscc) {
            throw 'ISCC.exe not found'
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc /Q installer\setup.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShutdownTimer.exe
            installer/Output/ShutdownTimer-Setup-*.exe
          generate_release_notes: true
